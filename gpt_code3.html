<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LocalKart – Shop local, grow local</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #1b2420;
      --muted: #5d6b64;
      --paper: #fbfaf6;
      --card: #fff;
      --line: #e4e1d6;
      --green: #0f5c4d;
      --green-d: #0a4338;
      --gold: #f2a91e;
      --red: #c8372d;
      --tint: #e8f1ee;
      --r: 14px;
      --head: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif;
      --body: 'DM Sans', system-ui, sans-serif
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    body {
      font-family: var(--body);
      color: var(--ink);
      background: var(--paper);
      line-height: 1.5
    }

    h1,
    h2,
    h3,
    .logo {
      font-family: var(--head);
      letter-spacing: -.01em
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer
    }

    :focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 20px
    }

    /* header */
    header {
      background: var(--green);
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 20
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 12px 20px;
      max-width: 1120px;
      margin: 0 auto;
      flex-wrap: wrap
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      text-decoration: none
    }

    .logo i {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--gold);
      color: var(--green-d);
      display: grid;
      place-items: center;
      font-style: normal;
      font-size: 1.2rem
    }

    nav {
      margin-left: auto;
      display: flex;
      gap: 4px;
      flex-wrap: wrap
    }

    nav a {
      color: #dcebe6;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 500
    }

    nav a:hover {
      background: rgba(255, 255, 255, .12)
    }

    nav a.on {
      background: #fff;
      color: var(--green-d)
    }

    .badge {
      background: var(--gold);
      color: var(--ink);
      border-radius: 999px;
      padding: 0 7px;
      font-size: .8rem;
      font-weight: 700;
      margin-left: 4px
    }

    /* sale strip + hero */
    .sale {
      background: var(--gold);
      text-align: center;
      font-weight: 700;
      padding: 8px 12px;
      font-size: .95rem
    }

    .hero {
      background: var(--tint);
      border-bottom: 1px solid var(--line)
    }

    .hero .wrap {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 32px;
      align-items: center;
      padding-top: 44px;
      padding-bottom: 44px
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.3rem);
      line-height: 1.05;
      font-weight: 800;
      color: var(--green-d)
    }

    .hero p {
      color: var(--muted);
      margin: 14px 0 22px;
      max-width: 46ch
    }

    .search {
      display: flex;
      background: #fff;
      border: 2px solid var(--green);
      border-radius: 999px;
      overflow: hidden;
      max-width: 520px
    }

    .search input {
      flex: 1;
      border: 0;
      padding: 13px 18px;
      background: transparent;
      min-width: 0
    }

    .search input:focus {
      outline: none
    }

    .search button {
      border: 0;
      background: var(--green);
      color: #fff;
      padding: 0 22px;
      font-weight: 700
    }

    .hero-art {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      font-size: 2.4rem
    }

    .hero-art span {
      aspect-ratio: 1;
      border-radius: var(--r);
      display: grid;
      place-items: center;
      background: #fff;
      border: 1px solid var(--line)
    }

    .hero-art span:nth-child(2n) {
      background: #fff3d6
    }

    .hero-art span:nth-child(5) {
      background: var(--green);
      color: #fff
    }

    /* sections */
    main {
      min-height: 60vh
    }

    .sec {
      padding: 34px 0
    }

    .sec-h {
      display: flex;
      justify-content: space-between;
      align-items: end;
      margin-bottom: 18px;
      gap: 12px;
      flex-wrap: wrap
    }

    .sec-h h2 {
      font-size: 1.6rem
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .chip {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 8px 16px;
      font-weight: 500
    }

    .chip:hover {
      border-color: var(--green)
    }

    .chip.on {
      background: var(--green);
      border-color: var(--green);
      color: #fff
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
      gap: 18px
    }

    .pc {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r);
      overflow: hidden;
      display: flex;
      flex-direction: column
    }

    .pimg {
      aspect-ratio: 4/3;
      display: grid;
      place-items: center;
      font-size: 3.6rem;
      position: relative
    }

    .pimg img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .tag {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: .78rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      background: #fff
    }

    .tag.low {
      color: #9a5b00
    }

    .tag.out {
      color: var(--red)
    }

    .tag.in {
      color: var(--green)
    }

    .pb {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1
    }

    .pb h3 {
      font-size: 1.08rem
    }

    .seller {
      color: var(--muted);
      font-size: .9rem
    }

    .price {
      font-weight: 700;
      font-size: 1.2rem;
      margin-top: auto;
      padding-top: 6px
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
      background: var(--green);
      color: #fff
    }

    .btn:hover {
      background: var(--green-d)
    }

    .btn:disabled {
      background: #c9ceca;
      cursor: not-allowed
    }

    .btn.alt {
      background: #fff;
      color: var(--green-d);
      border: 1px solid var(--green)
    }

    .btn.alt:hover {
      background: var(--tint)
    }

    .btn.del {
      background: #fff;
      color: var(--red);
      border: 1px solid var(--red)
    }

    .btn.del:hover {
      background: #fdeceb
    }

    .btn.sm {
      padding: 6px 12px;
      font-size: .88rem
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 50px 10px;
      border: 2px dashed var(--line);
      border-radius: var(--r)
    }

    /* cart */
    .cart {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 24px;
      align-items: start
    }

    .row {
      display: grid;
      grid-template-columns: 64px 1fr auto auto;
      gap: 14px;
      align-items: center;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 12px;
      margin-bottom: 12px
    }

    .row .pimg {
      width: 64px;
      aspect-ratio: 1;
      font-size: 1.9rem;
      border-radius: 10px;
      overflow: hidden
    }

    .qty {
      display: flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden
    }

    .qty button {
      border: 0;
      background: var(--tint);
      width: 34px;
      height: 34px;
      font-weight: 700
    }

    .qty span {
      min-width: 34px;
      text-align: center;
      font-weight: 700
    }

    .sum {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 20px;
      position: sticky;
      top: 90px
    }

    .sum div {
      display: flex;
      justify-content: space-between;
      margin: 8px 0
    }

    .sum .tot {
      font-size: 1.3rem;
      font-weight: 700;
      border-top: 1px solid var(--line);
      padding-top: 12px;
      margin-top: 12px
    }

    .sum .btn {
      width: 100%;
      margin-top: 10px;
      padding: 13px
    }

    /* dashboard */
    .dash {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 24px;
      align-items: start
    }

    .panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 20px;
      margin-bottom: 24px
    }

    .panel h2 {
      font-size: 1.25rem;
      margin-bottom: 14px
    }

    label {
      display: block;
      font-weight: 500;
      font-size: .92rem;
      margin-top: 12px
    }

    input,
    select {
      width: 100%;
      border: 1px solid #cfd3cd;
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
      margin-top: 4px
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px
    }

    .form-actions .btn {
      flex: 1
    }

    .tw {
      overflow-x: auto
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 520px
    }

    th,
    td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle
    }

    th {
      font-size: .88rem;
      color: var(--muted);
      font-weight: 500
    }

    td .pimg {
      width: 44px;
      aspect-ratio: 1;
      font-size: 1.4rem;
      border-radius: 8px;
      overflow: hidden;
      display: inline-grid;
      vertical-align: middle;
      margin-right: 10px
    }

    td .acts {
      display: flex;
      gap: 6px
    }

    .st {
      border-radius: 999px;
      padding: 3px 12px;
      font-size: .85rem;
      font-weight: 700;
      display: inline-block
    }

    .st.Pending {
      background: #fff3d6;
      color: #8a5a00
    }

    .st.Packed {
      background: #e3ecfb;
      color: #254a8f
    }

    .st.Delivered {
      background: var(--tint);
      color: var(--green-d)
    }

    td select {
      width: auto;
      margin: 0;
      padding: 6px 8px
    }

    .login {
      min-height: calc(100vh - 120px);
      display: grid;
      place-items: center;
      padding: 30px 20px;
      background: var(--tint)
    }

    .lbox {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 30px;
      width: 100%;
      max-width: 420px
    }

    .lbox h1 {
      font-size: 1.9rem;
      color: var(--green-d)
    }

    .lbox .sub {
      color: var(--muted);
      margin: 4px 0 18px
    }

    .roles {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 6px
    }

    .roles button {
      border: 2px solid var(--line);
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      font-weight: 700
    }

    .roles button.on {
      border-color: var(--green);
      background: var(--tint);
      color: var(--green-d)
    }

    .lbox .btn {
      width: 100%;
      padding: 13px;
      margin-top: 18px
    }

    .lbox .swap {
      background: none;
      border: 0;
      color: var(--green);
      font-weight: 700;
      margin-top: 14px;
      width: 100%;
      text-decoration: underline
    }

    .hint {
      background: #fff3d6;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: .88rem;
      margin-top: 14px
    }

    .err {
      color: var(--red);
      font-weight: 500;
      margin-top: 10px;
      min-height: 1.2em
    }

    nav .out {
      background: none;
      border: 1px solid rgba(255, 255, 255, .4);
      color: #fff;
      border-radius: 999px;
      padding: 7px 14px;
      margin-left: 6px
    }

    nav .out:hover {
      background: rgba(255, 255, 255, .12)
    }

    [hidden] {
      display: none !important
    }

    footer {
      background: var(--ink);
      color: #c9d1cc;
      text-align: center;
      padding: 26px 20px;
      margin-top: 40px;
      font-size: .92rem
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      z-index: 50;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .25)
    }

    .toast[hidden] {
      display: none
    }

    .tools-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin: 16px 0
    }

    .tools-row input,
    .tools-row select {
      width: auto;
      min-width: 150px;
      margin: 0
    }

    .product-tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px
    }

    .rating {
      color: #8a5a00;
      font-size: .9rem;
      font-weight: 700
    }

    .small-muted {
      color: var(--muted);
      font-size: .88rem
    }

    .heart {
      background: #fff;
      border: 1px solid var(--line);
      color: var(--red);
      border-radius: 10px;
      padding: 7px 10px
    }

    .compare-bar {
      position: sticky;
      bottom: 10px;
      background: #fff;
      border: 1px solid var(--line);
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 5px 20px #0001;
      z-index: 10;
      margin-top: 18px
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 16px 0
    }

    .stat {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px
    }

    .stat strong {
      display: block;
      font-size: 1.5rem;
      color: var(--green-d)
    }

    .chart {
      display: flex;
      align-items: end;
      gap: 12px;
      height: 145px;
      padding: 12px 4px 0;
      border-bottom: 1px solid var(--line)
    }

    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      height: 100%;
      justify-content: end
    }

    .bar-col i {
      display: block;
      width: min(34px, 80%);
      background: var(--green);
      border-radius: 6px 6px 0 0;
      min-height: 4px
    }

    .bar-col span {
      font-size: .75rem;
      color: var(--muted)
    }

    .shop-card {
      display: flex;
      gap: 16px;
      align-items: center;
      background: var(--tint);
      padding: 20px;
      border-radius: var(--r);
      margin: 16px 0
    }

    .shop-mark {
      font-size: 2rem;
      background: #fff;
      padding: 14px;
      border-radius: 14px
    }

    .compare-table {
      overflow: auto;
      margin-top: 12px
    }

    .review-box {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 8px
    }

    .review-box input {
      width: 100px;
      margin: 0;
      padding: 6px
    }

    .review-box button {
      padding: 6px 9px
    }

    @media(max-width:820px) {
      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }
    }

    @media(max-width:820px) {

      .hero .wrap,
      .cart,
      .dash {
        grid-template-columns: 1fr
      }

      .hero-art {
        display: none
      }

      nav {
        margin-left: 0;
        width: 100%
      }

      .row {
        grid-template-columns: 56px 1fr auto
      }

      .row>:last-child {
        grid-column: 2/4;
        justify-self: start
      }

      .sum {
        position: static
      }
    }

    @media(prefers-reduced-motion:no-preference) {

      .btn,
      .chip,
      nav a {
        transition: background .15s, border-color .15s
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="bar">
      <a class="logo" href="#home" aria-label="LocalKart home"><i>🛍️</i>LocalKart</a>
      <nav aria-label="Main" id="mainNav" hidden>
        <a href="#home" data-nav="home">Home</a>
        <a href="#products" data-nav="products">Products</a>
        <a href="#cart" data-nav="cart">Cart<span class="badge" id="cartCount">0</span></a>
        <a href="#orders" data-nav="orders" id="ordersLink">My Orders</a>
        <a href="#wishlist" data-nav="wishlist" id="wishlistLink">Wishlist</a>
        <a href="#shop" data-nav="shop">Local Shops</a>
        <a href="#seller" data-nav="seller" id="sellerLink">Seller Dashboard</a>
        <button class="out" data-logout>Log out</button>
      </nav>
    </div>
  </header>
  <div class="sale" id="saleBar" hidden>Big sale this week: up to 30% off on handmade and homegrown picks</div>
  <main id="view" aria-live="polite"></main>
  <footer>LocalKart · A digital marketplace for local small enterprises · CodeFest 2026, KLE Technological University
  </footer>
  <div class="toast" id="toast" role="status" hidden></div>

  <script>
    /* ================= CONFIG (Shreya: connect Flask here) =================
       Set USE_BACKEND = true once the Flask API is running.
       Expected endpoints:
         GET    /api/products             -> [{id,name,price,category,qty,seller,img}]
         POST   /api/products             body: product            (seller adds)
         PUT    /api/products/<id>        body: product            (seller edits)
         DELETE /api/products/<id>
         GET    /api/orders               -> [{id,customer,items,total,status}]
         POST   /api/orders               body: {customer,items,total}   (place order)
         PUT    /api/orders/<id>          body: {status}
    */
    const USE_BACKEND = false;
    const API_BASE = 'http://localhost:5000/api';
    let CURRENT_SELLER = '';   // set from the logged-in seller's shop name
    /* Login endpoints (Shreya):
         POST /api/login     body: {email,password,role}        -> {name,role}
         POST /api/register  body: {name,email,password,role}   -> {name,role}
       Demo mode (USE_BACKEND=false): any email + password works.
       Use seller@localkart.in to log in as the sample seller "Meena Handlooms". */
    const CATEGORIES = ['All', 'Food', 'Clothing', 'Handicrafts', 'Home', 'Beauty'];
    const TINT = { Food: '#fff3d6', Clothing: '#e8eefb', Handicrafts: '#fbe8e4', Home: '#e8f1ee', Beauty: '#f4e8f5' };

    async function api(method, path, body) {
      if (!USE_BACKEND) return null;
      try {
        const r = await fetch(API_BASE + path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
        if (!r.ok) throw new Error(r.status);
        return await r.json();
      } catch (e) { toast('Could not reach the server. Showing saved data.'); return null; }
    }

    /* ================= STATE (sample data until backend is ready) ================= */
    const SAMPLE_PRODUCTS = [
      { id: 1, name: 'Belgaum Kunda Sweet Box', price: 280, category: 'Food', qty: 25, seller: 'Sri Sweets', area: 'Camp', rating: 4.8, reviews: 32, img: 'https://images.unsplash.com/photo-1605197161470-5d5a3a1c8c3f?auto=format&fit=crop&w=700&q=80' },
      { id: 2, name: 'Handloom Cotton Saree', price: 1450, category: 'Clothing', qty: 6, seller: 'Meena Handlooms', area: 'Tilakwadi', rating: 4.7, reviews: 18, img: 'https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=700&q=80' },
      { id: 3, name: 'Kolhapuri Leather Chappals', price: 899, category: 'Clothing', qty: 14, seller: 'Patil Footwear', area: 'Shahapur', rating: 4.5, reviews: 21, img: 'https://images.unsplash.com/photo-1543163521-1bf539c55dd2?auto=format&fit=crop&w=700&q=80' },
      { id: 4, name: 'Clay Diya Set (12)', price: 150, category: 'Handicrafts', qty: 40, seller: 'Kumbar Pottery', area: 'Vadgaon', rating: 4.9, reviews: 41, img: 'https://images.unsplash.com/photo-1603006905003-be475563bc59?auto=format&fit=crop&w=700&q=80' },
      { id: 5, name: 'Cold-Pressed Groundnut Oil 1L', price: 310, category: 'Food', qty: 3, seller: 'Gowda Oil Mill', area: 'Udyambag', rating: 4.6, reviews: 15, img: 'https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?auto=format&fit=crop&w=700&q=80' },

    async function doLogin(form) {
      const f = new FormData(form), email = (f.get('email') || '').trim(), pw = f.get('password') || '', reg = S.mode === 'register';
      const name = (f.get('name') || '').trim();
      if (!/^\S+@\S+\.\S+$/.test(email)) return fail('Enter a valid email address.');
      if (pw.length < 4) return fail('Password must be at least 4 characters.');
      if (reg && !name) return fail('Enter ' + (S.role === 'seller' ? 'your shop name.' : 'your name.'));
      let u = await api('POST', reg ? '/register' : '/login', { name, email, password: pw, role: S.role });
      if (!u) {
        if (USE_BACKEND) return fail('Login failed. Check your details and try again.');
        const pre = email.split('@')[0];
        u = { name: reg ? name : (S.role === 'seller' && email.toLowerCase() === 'seller@localkart.in') ? 'Meena Handlooms' : pre.charAt(0).toUpperCase() + pre.slice(1), role: S.role };
      }
      S.user = { name: u.name, role: u.role || S.role }; S.err = '';
      if (S.user.role === 'seller') CURRENT_SELLER = S.user.name;
      try { localStorage.setItem('lk_user', JSON.stringify(S.user)); } catch (e) { }
      location.hash = S.user.role === 'seller' ? '#seller' : '#home'; render();
    }
    function fail(m) { S.err = m; render(); }
    function logout() { S.user = null; CURRENT_SELLER = ''; S.cart = []; S.editing = null; saveCart(); try { localStorage.removeItem('lk_user'); } catch (e) { } location.hash = ''; render(); }

      if (r.startsWith('shop-')) { $('#view').innerHTML = shopProfile(decodeURIComponent(r.slice(5))); return; }
      if (v === 'seller' && S.user.role !== 'seller') v = 'home';
      $('#view').innerHTML = VIEWS[v]();

    function addToCart(id) {
      const p = S.products.find(x => x.id === id); if (!p || p.qty <= 0) return;
      const it = S.cart.find(x => x.id === id);
      if (it) { if (it.n >= p.qty) return toast('Only ' + p.qty + ' available'); it.n++; } else S.cart.push({ ...p, n: 1 });
      saveCart(); render(); toast(p.name + ' added to cart');
    }
    function changeQty(id, d) {
      const it = S.cart.find(x => x.id === id); const p = S.products.find(x => x.id === id); if (!it) return;
      const n = it.n + d; if (n < 1) return;
      if (p && n > p.qty) return toast('Only ' + p.qty + ' available');
      it.n = n; saveCart(); render();
    }
    async function placeOrder() {
      const name = ($('#cust').value || '').trim();
      if (!name) { $('#cust').focus(); return toast('Please enter your name to place the order'); }
      const total = S.cart.reduce((s, i) => s + i.price * i.n, 0);
      S.payment = ($('#payment') || {}).value || S.payment;
      const order = { customer: name, customerEmail: S.user.email || '', items: S.cart.map(i => i.name + ' × ' + i.n).join(', '), seller: 'Multiple', total, payment: S.payment, status: 'Pending' };
      const saved = await api('POST', '/orders', order);
      order.id = saved && saved.id ? saved.id : S.nextOrder++;
      S.cart.forEach(i => { const p = S.products.find(x => x.id === i.id); if (p) p.qty = Math.max(0, p.qty - i.n); });
      S.orders.unshift(order); saveOrders(); S.cart = []; saveCart(); location.hash = '#orders'; render();
      toast('Order #' + order.id + ' placed. Thank you for shopping local!');
    }
    function readFile(f) { return new Promise(res => { if (!f || !f.size) return res(null); const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => res(null); r.readAsDataURL(f); }); }
    async function saveProduct(form) {
      const f = new FormData(form); const e = S.editing ? S.products.find(p => p.id === S.editing) : null;
      const pic = await readFile(f.get('image'));
      const data = { name: f.get('name').trim(), price: +f.get('price'), qty: +f.get('qty'), category: f.get('category'), seller: CURRENT_SELLER, area: (e && e.area) || 'Belgaum', rating: (e && e.rating) || 0, reviews: (e && e.reviews) || 0, img: pic || (e ? e.img : 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=700&q=80') };
      if (e) { await api('PUT', '/products/' + e.id, data); Object.assign(e, data); toast('Product updated'); }
      else { const saved = await api('POST', '/products', data); data.id = saved && saved.id ? saved.id : S.nextId++; S.products.unshift(data); toast('Product added'); }
      S.editing = null; render();
    }
    async function deleteProduct(id) {
      const p = S.products.find(x => x.id === id); if (!p || !confirm('Delete “' + p.name + '”?')) return;
      await api('DELETE', '/products/' + id);
      S.products = S.products.filter(x => x.id !== id); S.cart = S.cart.filter(x => x.id !== id); saveCart(); render(); toast('Product deleted');
    }

    document.addEventListener('click', e => {
      const t = e.target.closest('button'); if (!t) return; const d = t.dataset;
      if (t.hasAttribute('data-logout')) logout();
      else if (d.role) { S.role = d.role; S.err = ''; render(); }
      else if (d.mode) { S.mode = d.mode; S.err = ''; render(); }
      else if (d.add) addToCart(+d.add);
      else if (d.cat) { S.cat = d.cat; render(); }
      else if (d.wish) { const id = +d.wish; S.wishlist = S.wishlist.includes(id) ? S.wishlist.filter(x => x !== id) : [...S.wishlist, id]; saveWishlist(); render(); }
      else if (d.compare) { const id = +d.compare; if (S.compare.includes(id)) S.compare = S.compare.filter(x => x !== id); else if (S.compare.length >= 3) toast('Compare up to 3 products'); else S.compare.push(id); render(); }
      else if (t.hasAttribute('data-showcompare')) { location.hash = '#compare'; }
      else if (t.hasAttribute('data-clearcompare')) { S.compare = []; render(); }
      else if (d.shop) { location.hash = '#shop-' + encodeURIComponent(d.shop); render(); }
      else if (d.goto) { location.hash = '#' + d.goto; }
      else if (d.review) { const box = t.parentElement.querySelector('input'); const rating = Number(box.value); const p = S.products.find(x => x.id === +d.review); if (!rating || rating < 1 || rating > 5) toast('Enter a rating from 1 to 5'); else { p.rating = Number((((p.rating || 0) * (p.reviews || 0) + rating) / ((p.reviews || 0) + 1)).toFixed(1)); p.reviews = (p.reviews || 0) + 1; render(); toast('Thanks for rating this product!'); } }
      else if (d.inc) changeQty(+d.inc, 1);
      else if (d.dec) changeQty(+d.dec, -1);
      else if (d.rm) { S.cart = S.cart.filter(i => i.id !== +d.rm); saveCart(); render(); }
      else if (t.hasAttribute('data-order')) placeOrder();
      else if (d.edit) { S.editing = +d.edit; render(); window.scrollTo(0, 0); }
      else if (t.hasAttribute('data-cancel')) { S.editing = null; render(); }
      else if (d.del) deleteProduct(+d.del);
    });
    document.addEventListener('submit', e => {
      e.preventDefault();
      if (e.target.id === 'lf') doLogin(e.target);
      else if (e.target.id === 'pf') saveProduct(e.target);
      else if (e.target.hasAttribute('data-search')) { S.q = e.target.querySelector('input').value; if (location.hash !== '#products' && location.hash !== '#home' && location.hash !== '') location.hash = '#products'; render(); }
    });
    document.addEventListener('change', async e => {
      if (e.target.id === 'sortProducts') { S.sort = e.target.value; render(); }
      if (e.target.id === 'priceFilter') { S.maxPrice = +e.target.value; render(); }
      if (e.target.id === 'areaFilter') { S.area = e.target.value; render(); }
      if (e.target.id === 'payment') S.payment = e.target.value;
      if (e.target.dataset.status) { const o = S.orders.find(x => x.id === +e.target.dataset.status); o.status = e.target.value; await api('PUT', '/orders/' + o.id, { status: o.status }); saveOrders(); toast('Order #' + o.id + ' marked ' + o.status); }
    });

    /* initial load: fetch real data if backend is on */
    (async () => {
      if (USE_BACKEND) { const p = await api('GET', '/products'); if (p) S.products = p; const o = await api('GET', '/orders'); if (o) S.orders = o; }
      render();
    })();
  </script>
</body>

</html>
