<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LocalKart – Shop local, grow local</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #1b2420;
      --muted: #5d6b64;
      --paper: #fbfaf6;
      --card: #fff;
      --line: #e4e1d6;
      --green: #0f5c4d;
      --green-d: #0a4338;
      --gold: #f2a91e;
      --red: #c8372d;
      --tint: #e8f1ee;
      --r: 14px;
      --head: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif;
      --body: 'DM Sans', system-ui, sans-serif
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    body {
      font-family: var(--body);
      color: var(--ink);
      background: var(--paper);
      line-height: 1.5
    }

    h1,
    h2,
    h3,
    .logo {
      font-family: var(--head);
      letter-spacing: -.01em
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer
    }

    :focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 20px
    }

    /* header */
    header {
      background: var(--green);
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 20
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 12px 20px;
      max-width: 1120px;
      margin: 0 auto;
      flex-wrap: wrap
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      text-decoration: none
    }

    .logo i {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--gold);
      color: var(--green-d);
      display: grid;
      place-items: center;
      font-style: normal;
      font-size: 1.2rem
    }

    nav {
      margin-left: auto;
      display: flex;
      gap: 4px;
      flex-wrap: wrap
    }

    nav a {
      color: #dcebe6;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 500
    }

    nav a:hover {
      background: rgba(255, 255, 255, .12)
    }

    nav a.on {
      background: #fff;
      color: var(--green-d)
    }

    .badge {
      background: var(--gold);
      color: var(--ink);
      border-radius: 999px;
      padding: 0 7px;
      font-size: .8rem;
      font-weight: 700;
      margin-left: 4px
    }

    /* sale strip + hero */
    .sale {
      background: var(--gold);
      text-align: center;
      font-weight: 700;
      padding: 8px 12px;
      font-size: .95rem
    }

    .hero {
      background: var(--tint);
      border-bottom: 1px solid var(--line)
    }

    .hero .wrap {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 32px;
      align-items: center;
      padding-top: 44px;
      padding-bottom: 44px
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.3rem);
      line-height: 1.05;
      font-weight: 800;
      color: var(--green-d)
    }

    .hero p {
      color: var(--muted);
      margin: 14px 0 22px;
      max-width: 46ch
    }

    .search {
      display: flex;
      background: #fff;
      border: 2px solid var(--green);
      border-radius: 999px;
      overflow: hidden;
      max-width: 520px
    }

    .search input {
      flex: 1;
      border: 0;
      padding: 13px 18px;
      background: transparent;
      min-width: 0
    }

    .search input:focus {
      outline: none
    }

    .search button {
      border: 0;
      background: var(--green);
      color: #fff;
      padding: 0 22px;
      font-weight: 700
    }

    .hero-art {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      font-size: 2.4rem
    }

    .hero-art span {
      aspect-ratio: 1;
      border-radius: var(--r);
      display: grid;
      place-items: center;
      background: #fff;
      border: 1px solid var(--line)
    }

    .hero-art span:nth-child(2n) {
      background: #fff3d6
    }

    .hero-art span:nth-child(5) {
      background: var(--green);
      color: #fff
    }

    /* sections */
    main {
      min-height: 60vh
    }

    .sec {
      padding: 34px 0
    }

    .sec-h {
      display: flex;
      justify-content: space-between;
      align-items: end;
      margin-bottom: 18px;
      gap: 12px;
      flex-wrap: wrap
    }

    .sec-h h2 {
      font-size: 1.6rem
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .chip {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 8px 16px;
      font-weight: 500
    }

    .chip:hover {
      border-color: var(--green)
    }

    .chip.on {
      background: var(--green);
      border-color: var(--green);
      color: #fff
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
      gap: 18px
    }

    .pc {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r);
      overflow: hidden;
      display: flex;
      flex-direction: column
    }

    .pimg {
      aspect-ratio: 4/3;
      display: grid;
      place-items: center;
      font-size: 3.6rem;
      position: relative
    }

    .pimg img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .tag {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: .78rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      background: #fff
    }

    .tag.low {
      color: #9a5b00
    }

    .tag.out {
      color: var(--red)
    }

    .tag.in {
      color: var(--green)
    }

    .pb {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1
    }

    .pb h3 {
      font-size: 1.08rem
    }

    .seller {
      color: var(--muted);
      font-size: .9rem
    }

    .price {
      font-weight: 700;
      font-size: 1.2rem;
      margin-top: auto;
      padding-top: 6px
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
      background: var(--green);
      color: #fff
    }

    .btn:hover {
      background: var(--green-d)
    }

    .btn:disabled {
      background: #c9ceca;
      cursor: not-allowed
    }

    .btn.alt {
      background: #fff;
      color: var(--green-d);
      border: 1px solid var(--green)
    }

    .btn.alt:hover {
      background: var(--tint)
    }

    .btn.del {
      background: #fff;
      color: var(--red);
      border: 1px solid var(--red)
    }

    .btn.del:hover {
      background: #fdeceb
    }

    .btn.sm {
      padding: 6px 12px;
      font-size: .88rem
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 50px 10px;
      border: 2px dashed var(--line);
      border-radius: var(--r)
    }

    /* cart */
    .cart {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 24px;
      align-items: start
    }

    .row {
      display: grid;
      grid-template-columns: 64px 1fr auto auto;
      gap: 14px;
      align-items: center;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 12px;
      margin-bottom: 12px
    }

    .row .pimg {
      width: 64px;
      aspect-ratio: 1;
      font-size: 1.9rem;
      border-radius: 10px;
      overflow: hidden
    }

    .qty {
      display: flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden
    }

    .qty button {
      border: 0;
      background: var(--tint);
      width: 34px;
      height: 34px;
      font-weight: 700
    }

    .qty span {
      min-width: 34px;
      text-align: center;
      font-weight: 700
    }

    .sum {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 20px;
      position: sticky;
      top: 90px
    }

    .sum div {
      display: flex;
      justify-content: space-between;
      margin: 8px 0
    }

    .sum .tot {
      font-size: 1.3rem;
      font-weight: 700;
      border-top: 1px solid var(--line);
      padding-top: 12px;
      margin-top: 12px
    }

    .sum .btn {
      width: 100%;
      margin-top: 10px;
      padding: 13px
    }

    /* dashboard */
    .dash {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 24px;
      align-items: start
    }

    .panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 20px;
      margin-bottom: 24px
    }

    .panel h2 {
      font-size: 1.25rem;
      margin-bottom: 14px
    }

    label {
      display: block;
      font-weight: 500;
      font-size: .92rem;
      margin-top: 12px
    }

    input,
    select {
      width: 100%;
      border: 1px solid #cfd3cd;
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
      margin-top: 4px
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px
    }

    .form-actions .btn {
      flex: 1
    }

    .tw {
      overflow-x: auto
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 520px
    }

    th,
    td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle
    }

    th {
      font-size: .88rem;
      color: var(--muted);
      font-weight: 500
    }

    td .pimg {
      width: 44px;
      aspect-ratio: 1;
      font-size: 1.4rem;
      border-radius: 8px;
      overflow: hidden;
      display: inline-grid;
      vertical-align: middle;
      margin-right: 10px
    }

    td .acts {
      display: flex;
      gap: 6px
    }

    .st {
      border-radius: 999px;
      padding: 3px 12px;
      font-size: .85rem;
      font-weight: 700;
      display: inline-block
    }

    .st.Pending {
      background: #fff3d6;
      color: #8a5a00
    }

    .st.Packed {
      background: #e3ecfb;
      color: #254a8f
    }

    .st.Delivered {
      background: var(--tint);
      color: var(--green-d)
    }

    td select {
      width: auto;
      margin: 0;
      padding: 6px 8px
    }

    footer {
      background: var(--ink);
      color: #c9d1cc;
      text-align: center;
      padding: 26px 20px;
      margin-top: 40px;
      font-size: .92rem
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      z-index: 50;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .25)
    }

    .toast[hidden] {
      display: none
    }

    @media(max-width:820px) {

      .hero .wrap,
      .cart,
      .dash {
        grid-template-columns: 1fr
      }

      .hero-art {
        display: none
      }

      nav {
        margin-left: 0;
        width: 100%
      }

      .row {
        grid-template-columns: 56px 1fr auto
      }

      .row>:last-child {
        grid-column: 2/4;
        justify-self: start
      }

      .sum {
        position: static
      }
    }

    @media(prefers-reduced-motion:no-preference) {

      .btn,
      .chip,
      nav a {
        transition: background .15s, border-color .15s
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="bar">
      <a class="logo" href="#home" aria-label="LocalKart home"><i>🛍️</i>LocalKart</a>
      <nav aria-label="Main">
        <a href="#home" data-nav="home">Home</a>
        <a href="#products" data-nav="products">Products</a>
        <a href="#cart" data-nav="cart">Cart<span class="badge" id="cartCount">0</span></a>
        <a href="#seller" data-nav="seller">Seller Dashboard</a>
      </nav>
    </div>
  </header>
  <div class="sale">Big sale this week: up to 30% off on handmade and homegrown picks</div>
  <main id="view" aria-live="polite"></main>
  <footer>LocalKart · A digital marketplace for local small enterprises · CodeFest 2026, KLE Technological University
  </footer>
  <div class="toast" id="toast" role="status" hidden></div>

  <script>
    /* ================= CONFIG (Shreya: connect Flask here) =================
       Set USE_BACKEND = true once the Flask API is running.
       Expected endpoints:
         GET    /api/products             -> [{id,name,price,category,qty,seller,img}]
         POST   /api/products             body: product            (seller adds)
         PUT    /api/products/<id>        body: product            (seller edits)
         DELETE /api/products/<id>
         GET    /api/orders               -> [{id,customer,items,total,status}]
         POST   /api/orders               body: {customer,items,total}   (place order)
         PUT    /api/orders/<id>          body: {status}
    */
    const USE_BACKEND = false;
    const API_BASE = 'http://localhost:5000/api';
    const CURRENT_SELLER = 'Meena Handlooms';   // replace with logged-in seller later
    const CATEGORIES = ['All', 'Food', 'Clothing', 'Handicrafts', 'Home', 'Beauty'];
    const TINT = { Food: '#fff3d6', Clothing: '#e8eefb', Handicrafts: '#fbe8e4', Home: '#e8f1ee', Beauty: '#f4e8f5' };

    async function api(method, path, body) {
      if (!USE_BACKEND) return null;
      try {
        const r = await fetch(API_BASE + path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
        if (!r.ok) throw new Error(r.status);
        return await r.json();
      } catch (e) { toast('Could not reach the server. Showing saved data.'); return null; }
    }

    /* ================= STATE (sample data until backend is ready) ================= */
    const SAMPLE_PRODUCTS = [
      { id: 1, name: 'Belgaum Kunda Sweet Box', price: 280, category: 'Food', qty: 25, seller: 'Sri Sweets', img: '🍬' },
      { id: 2, name: 'Handloom Cotton Saree', price: 1450, category: 'Clothing', qty: 6, seller: 'Meena Handlooms', img: '🥻' },
      { id: 3, name: 'Kolhapuri Leather Chappals', price: 899, category: 'Clothing', qty: 14, seller: 'Patil Footwear', img: '👡' },
      { id: 4, name: 'Clay Diya Set (12)', price: 150, category: 'Handicrafts', qty: 40, seller: 'Kumbar Pottery', img: '🪔' },
      { id: 5, name: 'Cold-Pressed Groundnut Oil 1L', price: 310, category: 'Food', qty: 3, seller: 'Gowda Oil Mill', img: '🫒' },
      { id: 6, name: 'Bamboo Storage Basket', price: 420, category: 'Home', qty: 0, seller: 'Meena Handlooms', img: '🧺' },
      { id: 7, name: 'Herbal Neem Soap (3 pack)', price: 199, category: 'Beauty', qty: 60, seller: 'Nisarga Naturals', img: '🧼' },
      { id: 8, name: 'Handwoven Table Runner', price: 550, category: 'Home', qty: 9, seller: 'Meena Handlooms', img: '🎀' }
    ];
    const SAMPLE_ORDERS = [
      { id: 1001, customer: 'Anita R.', items: 'Handloom Cotton Saree × 1', seller: 'Meena Handlooms', total: 1450, status: 'Pending' },
      { id: 1002, customer: 'Rahul K.', items: 'Handwoven Table Runner × 2', seller: 'Meena Handlooms', total: 1100, status: 'Packed' },
      { id: 1003, customer: 'Divya S.', items: 'Bamboo Storage Basket × 1', seller: 'Meena Handlooms', total: 420, status: 'Delivered' }
    ];
    const S = { products: [...SAMPLE_PRODUCTS], orders: [...SAMPLE_ORDERS], cart: [], cat: 'All', q: '', editing: null, nextId: 100, nextOrder: 1004 };
    try { const c = JSON.parse(localStorage.getItem('lk_cart') || '[]'); if (Array.isArray(c)) S.cart = c; } catch (e) { }
    function saveCart() { try { localStorage.setItem('lk_cart', JSON.stringify(S.cart)); } catch (e) { } }

    /* ================= HELPERS ================= */
    const $ = s => document.querySelector(s);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const money = n => '₹' + Number(n).toLocaleString('en-IN');
    let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2600); }
    function img(p) { return /^(data:|https?:)/.test(p.img) ? `<img src="${esc(p.img)}" alt="${esc(p.name)}">` : `<span aria-hidden="true">${esc(p.img || '📦')}</span>`; }
    function stock(p) { return p.qty <= 0 ? ['out', 'Out of stock'] : p.qty <= 5 ? ['low', 'Only ' + p.qty + ' left'] : ['in', 'In stock (' + p.qty + ')']; }
    function filtered() { const q = S.q.toLowerCase(); return S.products.filter(p => (S.cat === 'All' || p.category === S.cat) && (!q || (p.name + p.seller + p.category).toLowerCase().includes(q))); }

    function card(p) {
      const [k, l] = stock(p);
      return `<article class="pc"><div class="pimg" style="background:${TINT[p.category] || '#eee'}">${img(p)}<span class="tag ${k}">${l}</span></div>
 <div class="pb"><h3>${esc(p.name)}</h3><div class="seller">by ${esc(p.seller)}</div><div class="price">${money(p.price)}</div>
 <button class="btn" data-add="${p.id}" ${p.qty <= 0 ? 'disabled' : ''} style="margin-top:8px">${p.qty <= 0 ? 'Sold out' : 'Add to Cart'}</button></div></article>`;
    }
    function chips() { return `<div class="chips" role="group" aria-label="Categories">${CATEGORIES.map(c => `<button class="chip ${S.cat === c ? 'on' : ''}" data-cat="${c}">${c}</button>`).join('')}</div>`; }
    function searchBox() { return `<form class="search" data-search role="search"><input type="search" id="q" value="${esc(S.q)}" placeholder="Search sarees, sweets, pottery…" aria-label="Search products"><button type="submit">Search</button></form>`; }

    /* ================= VIEWS ================= */
    function home() {
      const list = filtered().slice(0, 4);
      return `<section class="hero"><div class="wrap"><div><h1>Shop local. Grow local.</h1>
 <p>Discover products from small shops in your city, all in one place.</p>${searchBox()}</div>
 <div class="hero-art" aria-hidden="true"><span>🥻</span><span>🍬</span><span>🪔</span><span>🧺</span><span>🛍️</span><span>🧼</span></div></div></section>
 <div class="wrap"><section class="sec"><div class="sec-h"><h2>Browse by category</h2></div>${chips()}</section>
 <section class="sec" style="padding-top:0"><div class="sec-h"><h2>Fresh from local shops</h2><a href="#products" class="btn alt sm" style="text-decoration:none">View all products</a></div>
 ${list.length ? `<div class="grid">${list.map(card).join('')}</div>` : '<div class="empty">No products match your search.</div>'}</section></div>`;
    }
    function products() {
      const list = filtered();
      return `<div class="wrap"><section class="sec"><div class="sec-h"><h2>All products</h2>${searchBox()}</div>${chips()}
 <div style="height:18px"></div>${list.length ? `<div class="grid">${list.map(card).join('')}</div>` : '<div class="empty">No products found. Try another category or search.</div>'}</section></div>`;
    }
    function cart() {
      const total = S.cart.reduce((s, i) => s + i.price * i.n, 0);
      if (!S.cart.length) return `<div class="wrap"><section class="sec"><h2 style="margin-bottom:16px">Your cart</h2><div class="empty">Your cart is empty.<br><br><a class="btn" href="#products" style="text-decoration:none;display:inline-block">Browse products</a></div></section></div>`;
      return `<div class="wrap"><section class="sec"><h2 style="margin-bottom:18px">Your cart</h2><div class="cart"><div>
 ${S.cart.map(i => `<div class="row"><div class="pimg" style="background:${TINT[i.category] || '#eee'}">${img(i)}</div>
  <div><strong>${esc(i.name)}</strong><div class="seller">by ${esc(i.seller)} · ${money(i.price)}</div></div>
  <div class="qty"><button data-dec="${i.id}" aria-label="Decrease quantity">−</button><span>${i.n}</span><button data-inc="${i.id}" aria-label="Increase quantity">+</button></div>
  <div style="display:flex;gap:10px;align-items:center"><strong>${money(i.price * i.n)}</strong><button class="btn del sm" data-rm="${i.id}">Remove</button></div></div>`).join('')}
 </div><aside class="sum"><h3>Order summary</h3>
  <div><span>Items</span><span>${S.cart.reduce((s, i) => s + i.n, 0)}</span></div>
  <div><span>Delivery</span><span>Free</span></div>
  <div class="tot"><span>Total</span><span>${money(total)}</span></div>
  <label for="cust">Your name</label><input id="cust" placeholder="Name for the order" autocomplete="name">
  <button class="btn" data-order>Place Order</button></aside></div></section></div>`;
    }
    function seller() {
      const e = S.editing ? S.products.find(p => p.id === S.editing) : null;
      const mine = S.products.filter(p => p.seller === CURRENT_SELLER);
      const orders = S.orders.filter(o => o.seller === CURRENT_SELLER || o.seller === 'Multiple');
      return `<div class="wrap"><section class="sec"><div class="sec-h"><h2>Seller dashboard · ${esc(CURRENT_SELLER)}</h2></div>
 <div class="dash"><div class="panel"><h2>${e ? 'Edit product' : 'Add a product'}</h2>
  <form id="pf"><label>Product name<input name="name" required value="${e ? esc(e.name) : ''}"></label>
  <div class="two"><label>Price (₹)<input name="price" type="number" min="1" required value="${e ? e.price : ''}"></label>
  <label>Quantity<input name="qty" type="number" min="0" required value="${e ? e.qty : ''}"></label></div>
  <label>Category<select name="category">${CATEGORIES.slice(1).map(c => `<option ${e && e.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
  <label>Product image<input name="image" type="file" accept="image/*"></label>
  <div class="form-actions"><button class="btn" type="submit">${e ? 'Save changes' : 'Add product'}</button>${e ? '<button class="btn alt" type="button" data-cancel>Cancel</button>' : ''}</div></form></div>
 <div><div class="panel"><h2>Your products</h2>${mine.length ? `<div class="tw"><table><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th></th></tr></thead><tbody>
  ${mine.map(p => `<tr><td><div class="pimg" style="background:${TINT[p.category] || '#eee'}">${img(p)}</div>${esc(p.name)}</td><td>${money(p.price)}</td><td>${p.qty}</td>
  <td><div class="acts"><button class="btn alt sm" data-edit="${p.id}">Edit</button><button class="btn del sm" data-del="${p.id}">Delete</button></div></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">You have not added any products yet.</div>'}</div>
 <div class="panel"><h2>Customer orders</h2>${orders.length ? `<div class="tw"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody>
  ${orders.map(o => `<tr><td>#${o.id}</td><td>${esc(o.customer)}</td><td>${esc(o.items)}</td><td>${money(o.total)}</td>
  <td><select data-status="${o.id}" aria-label="Order ${o.id} status">${['Pending', 'Packed', 'Delivered'].map(s => `<option ${o.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No orders yet.</div>'}</div></div></div></section></div>`;
    }

    /* ================= ROUTER ================= */
    const VIEWS = { home, products, cart, seller };
    function render() {
      const r = (location.hash || '#home').slice(1); const v = VIEWS[r] ? r : 'home';
      $('#view').innerHTML = VIEWS[v]();
      document.querySelectorAll('[data-nav]').forEach(a => { a.classList.toggle('on', a.dataset.nav === v); a.toggleAttribute('aria-current', a.dataset.nav === v); });
      $('#cartCount').textContent = S.cart.reduce((s, i) => s + i.n, 0);
    }
    window.addEventListener('hashchange', () => { window.scrollTo(0, 0); render(); });

    /* ================= ACTIONS ================= */
    function addToCart(id) {
      const p = S.products.find(x => x.id === id); if (!p || p.qty <= 0) return;
      const it = S.cart.find(x => x.id === id);
      if (it) { if (it.n >= p.qty) return toast('Only ' + p.qty + ' available'); it.n++; } else S.cart.push({ ...p, n: 1 });
      saveCart(); render(); toast(p.name + ' added to cart');
    }
    function changeQty(id, d) {
      const it = S.cart.find(x => x.id === id); const p = S.products.find(x => x.id === id); if (!it) return;
      const n = it.n + d; if (n < 1) return;
      if (p && n > p.qty) return toast('Only ' + p.qty + ' available');
      it.n = n; saveCart(); render();
    }
    async function placeOrder() {
      const name = ($('#cust').value || '').trim();
      if (!name) { $('#cust').focus(); return toast('Please enter your name to place the order'); }
      const total = S.cart.reduce((s, i) => s + i.price * i.n, 0);
      const order = { customer: name, items: S.cart.map(i => i.name + ' × ' + i.n).join(', '), seller: 'Multiple', total, status: 'Pending' };
      const saved = await api('POST', '/orders', order);
      order.id = saved && saved.id ? saved.id : S.nextOrder++;
      S.cart.forEach(i => { const p = S.products.find(x => x.id === i.id); if (p) p.qty = Math.max(0, p.qty - i.n); });
      S.orders.unshift(order); S.cart = []; saveCart(); location.hash = '#products'; render();
      toast('Order #' + order.id + ' placed. Thank you for shopping local!');
    }
    function readFile(f) { return new Promise(res => { if (!f || !f.size) return res(null); const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => res(null); r.readAsDataURL(f); }); }
    async function saveProduct(form) {
      const f = new FormData(form); const e = S.editing ? S.products.find(p => p.id === S.editing) : null;
      const pic = await readFile(f.get('image'));
      const data = { name: f.get('name').trim(), price: +f.get('price'), qty: +f.get('qty'), category: f.get('category'), seller: CURRENT_SELLER, img: pic || (e ? e.img : '📦') };
      if (e) { await api('PUT', '/products/' + e.id, data); Object.assign(e, data); toast('Product updated'); }
      else { const saved = await api('POST', '/products', data); data.id = saved && saved.id ? saved.id : S.nextId++; S.products.unshift(data); toast('Product added'); }
      S.editing = null; render();
    }
    async function deleteProduct(id) {
      const p = S.products.find(x => x.id === id); if (!p || !confirm('Delete “' + p.name + '”?')) return;
      await api('DELETE', '/products/' + id);
      S.products = S.products.filter(x => x.id !== id); S.cart = S.cart.filter(x => x.id !== id); saveCart(); render(); toast('Product deleted');
    }

    document.addEventListener('click', e => {
      const t = e.target.closest('button'); if (!t) return; const d = t.dataset;
      if (d.add) addToCart(+d.add);
      else if (d.cat) { S.cat = d.cat; render(); }
      else if (d.inc) changeQty(+d.inc, 1);
      else if (d.dec) changeQty(+d.dec, -1);
      else if (d.rm) { S.cart = S.cart.filter(i => i.id !== +d.rm); saveCart(); render(); }
      else if (t.hasAttribute('data-order')) placeOrder();
      else if (d.edit) { S.editing = +d.edit; render(); window.scrollTo(0, 0); }
      else if (t.hasAttribute('data-cancel')) { S.editing = null; render(); }
      else if (d.del) deleteProduct(+d.del);
    });
    document.addEventListener('submit', e => {
      e.preventDefault();
      if (e.target.id === 'pf') saveProduct(e.target);
      else if (e.target.hasAttribute('data-search')) { S.q = e.target.querySelector('input').value; if (location.hash !== '#products' && location.hash !== '#home' && location.hash !== '') location.hash = '#products'; render(); }
    });
    document.addEventListener('change', async e => {
      if (e.target.dataset.status) { const o = S.orders.find(x => x.id === +e.target.dataset.status); o.status = e.target.value; await api('PUT', '/orders/' + o.id, { status: o.status }); toast('Order #' + o.id + ' marked ' + o.status); }
    });

    /* initial load: fetch real data if backend is on */
    (async () => {
      if (USE_BACKEND) { const p = await api('GET', '/products'); if (p) S.products = p; const o = await api('GET', '/orders'); if (o) S.orders = o; }
      render();
    })();
  </script>
</body>

</html>
